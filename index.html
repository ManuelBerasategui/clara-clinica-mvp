<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7d76">
<title>Clara · Clínica dental</title>
<meta name="description" content="Prototipo de Clara: gestión de clínica dental con agentes de IA para WhatsApp, coberturas y facturación. Datos ficticios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="nav-backdrop" data-act="menu-close" aria-hidden="true"></div>
<div class="app">
  <aside class="sidebar" id="navigation" aria-label="Menú principal">
    <button class="btn ghost menu-close" data-act="menu-close">Cerrar menú ✕</button>
    <div class="brand"><div class="brandmark" data-icon="tooth"></div><div>clara<small>Clínica Dental Centro</small></div></div>
    <nav class="nav" id="sidenav"></nav>
    <div class="side-foot">
      <div class="side-demo"><b>Modo demostración.</b> Datos ficticios. No se envían mensajes reales ni se conecta a obras sociales.</div>
      <div class="side-user"><div class="avatar">LM</div><div><b>Lucía Méndez</b><small>Odontóloga · Dueña</small></div></div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button class="btn ghost menu-toggle" data-act="menu-open" aria-controls="navigation" aria-expanded="false">☰ Menú</button>
      <div class="brand"><div class="brandmark" data-icon="tooth"></div><div>clara</div></div>
      <div class="crumb">Clínica Dental Centro <span style="padding:0 7px;color:#c3cccd">/</span> <b id="crumb">Hoy</b></div>
      <div class="topspacer"></div>
      <button class="try-btn" data-act="phone-open" aria-label="Probar el WhatsApp como paciente"><span data-icon="phone"></span><span class="lbl-long">Probar WhatsApp como paciente</span><span class="lbl-short">Probar</span></button>
      <button class="iconbtn" data-act="go" data-page="whatsapp" aria-label="Conversaciones que necesitan una persona"><span data-icon="bell"></span><span class="dot hidden" id="bellcount"></span></button>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<nav class="bottomnav" id="bottomnav" aria-label="Navegación"></nav>
<button class="fab" data-act="new-appt" aria-label="Nuevo turno"><span data-icon="plus"></span></button>

<!-- Simulador de WhatsApp del paciente -->
<div class="phone-dock" id="phonedock" aria-hidden="true">
  <div class="phone" role="dialog" aria-label="Simulador de WhatsApp del paciente">
    <div class="ph-head">
      <button class="iconbtn" data-act="phone-close" aria-label="Cerrar simulador"><span data-icon="chevL"></span></button>
      <div class="avatar" data-icon="tooth"></div>
      <div style="flex:1;min-width:0"><b>Clínica Dental Centro</b><span id="ph-status">en línea · responde Clara (IA)</span></div>
      <button class="iconbtn" data-act="phone-reset" aria-label="Reiniciar esta conversación"><span data-icon="refresh"></span></button>
    </div>
    <div class="ph-persona"><label for="ph-persona">Escribís como</label><select id="ph-persona"></select></div>
    <div class="ph-msgs" id="ph-msgs" role="log" aria-label="Mensajes del simulador"></div>
    <div class="ph-sugg" id="ph-sugg"></div>
    <form class="ph-foot" id="ph-form" autocomplete="off">
      <input id="ph-input" placeholder="Escribí como si fueras el paciente…" aria-label="Mensaje del paciente">
      <button class="sendbtn" aria-label="Enviar"><span data-icon="send"></span></button>
    </form>
  </div>
</div>

<div class="sheet-bg" id="sheetbg" data-act="sheet-close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="grab"></div><div id="sheet-inner"></div></section>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="agent.js"></script>
<script src="app.js"></script>
</body>
</html>
